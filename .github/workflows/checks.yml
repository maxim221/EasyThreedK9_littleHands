name: Checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-regression:
    name: Python compile and regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile key Python files
        run: |
          python3 -m py_compile tools/k9_control_center.py tools/k9_marlin_sd.py tools/k9_cura_slice.py

      - name: Run regression checks
        run: |
          python3 tools/regression_checks.py
