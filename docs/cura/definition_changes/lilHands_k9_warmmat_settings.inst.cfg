[general]
version = 4
name = lilHands_k9_warmmat_settings
definition = custom

[metadata]
type = definition_changes
setting_version = 25

[values]
extruders_enabled_count = 1
machine_gcode_flavor = RepRap (RepRap)
machine_width = 100
machine_depth = 100
machine_height = 100
machine_start_gcode = ; Little Hands manual-zero workflow for EasyThreed K9 / K9 Plus
	; Expected fixed start pose on this printer:
	; X = fully left, Y = bed fully back (away from operator), Z = nozzle touching bed
	; This pose is treated as logical 0,0,0. Do not G28 before print.
	G92 X0 Y0 Z0
	G1 Z10.0 F600
	G92 E0
machine_end_gcode = M204 P250 T120 ;Gentle final presentation moves for the small Y-bed
	M104 S0 ;Hotend off
	M140 S0 ;Bed off in G-code even though bed is external
	G91
	G1 E-1 F1800
	G1 Z10 F1200
	G90
	G1 X95 F900
	G1 Y95 F600 ;Move bed toward the operator
